version: 2
updates:
  # Versão nova só é proposta depois de 7 dias, quando um pacote comprometido
  # costuma já ter sido retirado do repositório público.
  - package-ecosystem: "npm"
    directory: "/ConectAgente-web"
    schedule:
      interval: "weekly"
    # Menor e correção vão num PR só por ecossistema. Um PR por pacote estourou
    # o limite diário de deploys da Vercel em 05/11/2026.
    groups:
      menores-e-correcoes:
        update-types: ["minor", "patch"]
      # Versão maior (Expo, Next, React Native, Tailwind) muda API e entra como
      # migração planejada, testada no aparelho. Agrupada para virar um PR só,
      # não um por pacote. Correção de segurança continua vindo à parte.
      maiores:
        update-types: ["major"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: "npm"
    directory: "/ConectAgente-mobile"
    schedule:
      interval: "weekly"
    # Menor e correção vão num PR só por ecossistema. Um PR por pacote estourou
    # o limite diário de deploys da Vercel em 05/11/2026.
    groups:
      menores-e-correcoes:
        update-types: ["minor", "patch"]
      # Versão maior (Expo, Next, React Native, Tailwind) muda API e entra como
      # migração planejada, testada no aparelho. Agrupada para virar um PR só,
      # não um por pacote. Correção de segurança continua vindo à parte.
      maiores:
        update-types: ["major"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Menor e correção vão num PR só por ecossistema. Um PR por pacote estourou
    # o limite diário de deploys da Vercel em 05/11/2026.
    groups:
      menores-e-correcoes:
        update-types: ["minor", "patch"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
