name: CI

# Roda em qualquer branch, e nao so nas duas principais.
#
# O gatilho antigo listava `[main, develop]`, e a branch onde o trabalho
# acontecia nao estava na lista: o CI nunca rodava onde o codigo era escrito, e
# so apareceria num pull request, com tudo ja pronto, que e o momento mais caro
# para descobrir problema.
#
# O repositorio e publico, entao minuto de Actions e gratuito, e o
# `concurrency` abaixo cancela execucao de commit que ja foi substituido.
#
# As duas branches tem acento no nome por decisao do dono do repositorio. O
# `['**']` casa com qualquer uma, entao o gatilho de push nao depende disso,
# mas o de pull request precisa do nome exato, entre aspas.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['produção']

permissions:
  contents: read

# Cancela execucao anterior do mesmo ramo: ninguem precisa do resultado de um
# commit que ja foi substituido.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Aplicativo de campo
  # ---------------------------------------------------------------------------
  mobile:
    name: Aplicativo (tipos, testes, pacote)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ConectAgente-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ConectAgente-mobile/package-lock.json

      # `npm ci` em vez de `npm install`, para o CI usar exatamente as versoes
      # do package-lock. E sem `--legacy-peer-deps`: o conflito que obrigava a
      # usar a opcao era o @types/react travado em 19.0.x contra o
      # react-native 0.81.5, que exige ^19.1.0. Com o conflito resolvido, o CI
      # volta a validar dependencia de par de verdade.
      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npx tsc --noEmit

      - name: Executar testes
        run: npm run test:ci

      # Empacota de verdade com o Metro. Pega o que teste de unidade nao pega:
      # override de dependencia que quebra o bundler. Foi assim que image-size
      # 2.x e uuid 11.x foram reprovados, com
      # `TypeError: The "list" argument must be an instance of SharedArrayBuffer`.
      - name: Empacotar para Android
        run: npx expo export --platform android --output-dir ../.artefatos-mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  # ---------------------------------------------------------------------------
  # Painel web
  # ---------------------------------------------------------------------------
  web:
    name: Painel (tipos, lint, testes, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ConectAgente-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ConectAgente-web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Executar testes
        run: npm test -- --ci

      - name: Build de producao
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  # ---------------------------------------------------------------------------
  # Banco de dados
  # ---------------------------------------------------------------------------
  banco:
    name: Banco (permissao, sincronizacao, cadastro)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Os scripts sobem um cluster proprio numa porta propria e o destroem no
      # fim, entao nada depende de servico externo nem de senha. Mas eles
      # precisam dos binarios de SERVIDOR (initdb, pg_ctl), e nao so do
      # cliente: a imagem do runner muda com o tempo e supor que estao la ja
      # custou uma rodada vermelha.
      - name: Garantir o PostgreSQL servidor
        run: |
          if ! ls -d /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1; then
            echo "initdb nao encontrado, instalando o pacote de servidor"
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql
          fi
          PGBIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)
          echo "usando $PGBIN"
          "$PGBIN/initdb" --version
          "$PGBIN/pg_ctl" --version
          "$PGBIN/psql" --version

      # Estas tres suites existem porque os defeitos mais graves do projeto
      # nao apareciam em teste de unidade: cada lado estava coerente consigo
      # mesmo e o erro morava na juncao. Sete tabelas sem RLS, 61 colunas que
      # o aplicativo gravava e o servidor nao tinha, e cinco vocabularios
      # diferentes para o campo de papel.
      - name: Rodar as suites de banco
        run: bash ConectAgente-web/supabase/testes/rodar-todos.sh

      # O configurador escreve os .env. Um .env meio preenchido nao quebra o
      # aplicativo: ele sobe, as telas aparecem, e a sincronizacao falha em
      # silencio. Por isso o que se testa e a recusa, nao o caminho feliz.
      - name: Conferir o configurador do Supabase
        run: bash scripts/testar-configurador.sh

  # ---------------------------------------------------------------------------
  # Dependencias
  # ---------------------------------------------------------------------------
  dependencias:
    name: Vulnerabilidade em producao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # O que vai para producao tem que ficar em zero. A cadeia de
      # desenvolvimento nao entra: braces, sprintf-js e node-forge nao tem
      # versao corrigida publicada, e sao ferramenta que roda na maquina de
      # quem desenvolve, nao codigo entregue.
      - name: Painel web
        working-directory: ConectAgente-web
        run: npm audit --omit=dev --audit-level=low

      # O aplicativo depende do Expo, que declara a propria cadeia de build
      # como dependencia de execucao, entao `--omit=dev` nao separa os dois
      # lados aqui. O limite fica em critico: nenhuma critica e tolerada, e as
      # altas que sobram estao documentadas no commit das dependencias.
      - name: Aplicativo de campo
        working-directory: ConectAgente-mobile
        run: npm audit --audit-level=critical
