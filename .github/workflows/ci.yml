name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-mobile:
    name: Testes App Mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ConectAgente-mobile/package-lock.json
      - name: Instalar dependencias
        working-directory: ConectAgente-mobile
        run: npm install --legacy-peer-deps
      - name: Executar testes
        working-directory: ConectAgente-mobile
        run: npm run test:ci -- --passWithNoTests

  test-web:
    name: Testes Portal Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ConectAgente-web/package-lock.json
      - name: Instalar dependencias
        working-directory: ConectAgente-web
        run: npm install --legacy-peer-deps
      - name: Lint
        working-directory: ConectAgente-web
        run: npm run lint
      - name: Executar testes
        working-directory: ConectAgente-web
        run: npm test -- --ci

  build-web:
    name: Build Portal Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ConectAgente-web/package-lock.json
      - name: Instalar dependencias
        working-directory: ConectAgente-web
        run: npm install --legacy-peer-deps
      - name: Build de producao
        working-directory: ConectAgente-web
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
